name: Nightly CVE Scans

on:
  # Can be triggered after nightly-pipeline completes
  workflow_run:
    workflows: ["Nightly Pipeline"]
    types: [completed]
    branches: [main]
  
  # Also runs on its own schedule (in case nightly-pipeline didn't run or for additional scans)
  schedule:
    # Run every night at 4 AM UTC (after nightly builds at 2 AM)
    - cron: '0 4 * * *'
  
  # Manual trigger
  workflow_dispatch:
    inputs:
      scan_all_versions:
        description: 'Scan all versions (not just latest N)'
        required: false
        default: false
        type: boolean
      send_notification:
        description: 'Send Discord notification'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

env:
  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

jobs:
  scan-catalog:
    name: Scan Entire Catalog
    runs-on: [self-hosted, Linux, X64]
    # Skip if triggered by failed pipeline
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    outputs:
      has_changes: ${{ steps.check-changes.outputs.has_changes }}
      total_critical: ${{ steps.summary.outputs.total_critical }}
      total_high: ${{ steps.summary.outputs.total_high }}
    
    steps:
      - name: Checkout apps repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      
      - name: Checkout d0s CLI repository
        uses: actions/checkout@v4
        with:
          repository: d0s-dev/d0s
          ref: main
          path: d0s-repo
          token: ${{ secrets.GH_PAT }}
      
      - name: Build and install d0s CLI
        run: |
          cd d0s-repo
          go build -o d0s ./cmd/d0s
          mkdir -p $HOME/bin
          mv d0s $HOME/bin/d0s
          echo "$HOME/bin" >> $GITHUB_PATH
          $HOME/bin/d0s version
      
      - name: Install Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b $HOME/bin
          $HOME/bin/grype version
      
      - name: Run full catalog scan
        id: scan
        run: |
          cd catalog
          
          # Determine versions to scan
          if [ "${{ github.event.inputs.scan_all_versions }}" = "true" ]; then
            VERSIONS_FLAG=""
          else
            VERSIONS_FLAG="--versions 3"
          fi
          
          # Run the scan-catalog internal command
          d0s internal scan-catalog \
            --catalog-path . \
            --parallel 4 \
            $VERSIONS_FLAG \
            --output json > scan-output.json 2> scan-errors.log || true
          
          # Check if scan completed
          if [ -f scan-output.json ] && [ -s scan-output.json ]; then
            echo "scan_completed=true" >> $GITHUB_OUTPUT
          else
            echo "scan_completed=false" >> $GITHUB_OUTPUT
            echo "Scan output empty or missing"
            cat scan-errors.log 2>/dev/null || true
          fi
      
      - name: Regenerate catalog data
        run: |
          cd catalog
          
          # Generate central CVE database from scan results
          d0s catalog cve-db --catalog-path . || true
          
          # Refresh apps.json with updated CVE aggregates
          d0s catalog refresh --catalog-path . || true
          
          echo "✅ Regenerated apps.json and cves.json"
      
      - name: Check for changes
        id: check-changes
        run: |
          if git diff --quiet catalog/; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No CVE changes detected"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            CHANGED_FILES=$(git diff --name-only catalog/ | wc -l | tr -d ' ')
            echo "changed_files=$CHANGED_FILES" >> $GITHUB_OUTPUT
            echo "CVE changes detected in $CHANGED_FILES files"
          fi
      
      - name: Generate summary
        id: summary
        run: |
          if [ -f "catalog/apps.json" ]; then
            TOTAL_CRITICAL=$(jq '[.apps[].cves.critical] | add // 0' catalog/apps.json)
            TOTAL_HIGH=$(jq '[.apps[].cves.high] | add // 0' catalog/apps.json)
            TOTAL_MEDIUM=$(jq '[.apps[].cves.medium] | add // 0' catalog/apps.json)
            TOTAL_LOW=$(jq '[.apps[].cves.low] | add // 0' catalog/apps.json)
            APP_COUNT=$(jq '.apps | length' catalog/apps.json)
            
            echo "total_critical=$TOTAL_CRITICAL" >> $GITHUB_OUTPUT
            echo "total_high=$TOTAL_HIGH" >> $GITHUB_OUTPUT
            echo "total_medium=$TOTAL_MEDIUM" >> $GITHUB_OUTPUT
            echo "total_low=$TOTAL_LOW" >> $GITHUB_OUTPUT
            echo "app_count=$APP_COUNT" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit CVE updates
        if: steps.check-changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add catalog/
          git commit -m "chore: CVE scan updates $(date -u +%Y-%m-%d)

          - Scanned catalog for latest vulnerabilities
          - Updated scannedAt timestamps in manifests
          - Regenerated apps.json and cves.json
          - Total: ${{ steps.summary.outputs.total_critical }} Critical, ${{ steps.summary.outputs.total_high }} High"
          
          git push
      
      - name: Generate workflow summary
        if: always()
        run: |
          echo "## 🔍 Nightly CVE Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Scan Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f "catalog/apps.json" ]; then
            echo "### CVE Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| 🔴 Critical | ${{ steps.summary.outputs.total_critical }} |" >> $GITHUB_STEP_SUMMARY
            echo "| 🟠 High | ${{ steps.summary.outputs.total_high }} |" >> $GITHUB_STEP_SUMMARY
            echo "| 🟡 Medium | ${{ steps.summary.outputs.total_medium }} |" >> $GITHUB_STEP_SUMMARY
            echo "| ⚪ Low | ${{ steps.summary.outputs.total_low }} |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Apps Scanned:** ${{ steps.summary.outputs.app_count }}" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ steps.check-changes.outputs.has_changes }}" = "true" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ **Changes committed:** ${{ steps.check-changes.outputs.changed_files }} files updated" >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "ℹ️ **No changes:** CVE database is up to date" >> $GITHUB_STEP_SUMMARY
          fi
      
      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-results-${{ github.run_id }}
          path: |
            catalog/scan-output.json
            catalog/apps.json
            catalog/cves.json
          retention-days: 30

  # ============================================================================
  # Notify: Send Discord notification
  # ============================================================================
  notify:
    name: Discord Notification
    needs: scan-catalog
    if: |
      always() && 
      (github.event_name == 'schedule' || 
       github.event_name == 'workflow_run' || 
       github.event.inputs.send_notification == 'true')
    runs-on: ubuntu-latest
    
    steps:
      - name: Send Discord notification
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "No Discord webhook configured, skipping notification"
            exit 0
          fi
          
          SCAN_STATUS="${{ needs.scan-catalog.result }}"
          HAS_CHANGES="${{ needs.scan-catalog.outputs.has_changes }}"
          TOTAL_CRITICAL="${{ needs.scan-catalog.outputs.total_critical }}"
          TOTAL_HIGH="${{ needs.scan-catalog.outputs.total_high }}"
          
          # Determine status and color
          if [ "$SCAN_STATUS" = "success" ]; then
            if [ "$TOTAL_CRITICAL" -gt 0 ]; then
              STATUS="⚠️ Scan Complete - Critical CVEs Found"
              COLOR=15158332
            else
              STATUS="✅ Scan Complete"
              COLOR=3066993
            fi
          else
            STATUS="❌ Scan Failed"
            COLOR=15158332
          fi
          
          curl -H "Content-Type: application/json" -X POST "$WEBHOOK_URL" -d @- <<EOF
          {
            "embeds": [{
              "title": "🔍 Nightly CVE Scan",
              "description": "$STATUS",
              "color": $COLOR,
              "fields": [
                {"name": "🔴 Critical", "value": "${TOTAL_CRITICAL:-0}", "inline": true},
                {"name": "🟠 High", "value": "${TOTAL_HIGH:-0}", "inline": true},
                {"name": "Changes", "value": "${HAS_CHANGES:-false}", "inline": true},
                {"name": "Run", "value": "[View Details](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})", "inline": false}
              ],
              "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
              "footer": {"text": "d0s.dev CVE Scanner"}
            }]
          }
          EOF

  # ============================================================================
  # Trigger Site: Dispatch event to rebuild site
  # ============================================================================
  trigger-site:
    name: Trigger Site Rebuild
    needs: scan-catalog
    if: needs.scan-catalog.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    
    steps:
      - name: Trigger site rebuild
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GH_PAT }}
          repository: d0s-dev/site
          event-type: catalog-updated
          client-payload: '{"triggered_by": "nightly-scan", "run_id": "${{ github.run_id }}"}'
